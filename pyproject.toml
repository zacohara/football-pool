[project]
name = "football-pool"
version = "0.1.0"
description = "Static scoreboard site for a family NFL leveling-factor pool"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.scripts]
pool = "football_pool.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_pool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is a gate, not a report: CI fails below the threshold, and the Pages
# deploy is gated on CI, so an untested regression never reaches the site.
addopts = "-q --cov=football_pool --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src/football_pool"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
